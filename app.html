<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SIMARSIP — Ruang Kerja</title><link rel="stylesheet" href="css/style.css"></head>
<body>
  <div id="app" class="workspace">
    <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Tutup sidebar" aria-expanded="true" aria-controls="appSidebar" title="Tutup sidebar"><span aria-hidden="true">×</span></button>
    <aside id="appSidebar" class="sidebar"><a class="brand" href="index.html"><svg class="sidebar-logo-mark" viewBox="0 0 500 420" width="500" height="420" role="img" aria-label="Logo SIMARSIP" xmlns="http://www.w3.org/2000/svg"><path fill="#0875d1" stroke="#d9efff" stroke-width="12" d="M114 104h104V68q0-17 18-17h112q17 0 17 17v25h35q18 0 18 18v32H111v-20q0-19 3-19zM127 111h239q14 0 14 15v91q0 17-17 19l-192 24q-19 2-20-18z"/><path fill="none" stroke="#d9efff" stroke-width="13" stroke-linecap="round" d="M121 110h96V73q0-9 10-9h100q9 0 9 10v28h31M146 91h73m-73 17h62m-62 17h50"/><path fill="none" stroke="#36c8ff" stroke-width="20" d="M73 221c-39 28-42 54-14 72 47 31 188 14 283-29 48-22 76-49 69-70-4-12-19-21-42-26 35 3 62 16 70 37 16 42-41 91-126 122-109 40-242 42-290 2-34-28-14-70 50-108z"/></svg><span>SIMARSIP</span></a><div id="identity"></div><nav id="navigation"></nav><button id="logout" class="logout">Keluar</button></aside>
    <main class="content" id="content"><section class="panel app-loading"><h1>Memuat SIMARSIP…</h1><p>Menyiapkan sesi dan data aplikasi.</p></section></main>
  </div>
  <script>const sidebarToggle=document.getElementById('sidebarToggle'),workspace=document.getElementById('app');if(window.matchMedia('(max-width:700px)').matches){workspace.classList.add('sidebar-collapsed');sidebarToggle.setAttribute('aria-expanded','false');sidebarToggle.setAttribute('aria-label','Buka sidebar');sidebarToggle.title='Buka sidebar';sidebarToggle.querySelector('span').textContent='☰'}sidebarToggle.addEventListener('click',function(){const collapsed=workspace.classList.toggle('sidebar-collapsed');sidebarToggle.setAttribute('aria-expanded',String(!collapsed));sidebarToggle.setAttribute('aria-label',collapsed?'Buka sidebar':'Tutup sidebar');sidebarToggle.title=collapsed?'Buka sidebar':'Tutup sidebar';sidebarToggle.querySelector('span').textContent=collapsed?'☰':'×'});</script>
  <script>window.addEventListener('error',function(event){const target=document.getElementById('content');if(target&&event.error){target.innerHTML='<section class="panel"><h1>Aplikasi gagal dimuat</h1><p>'+String(event.error.message||event.message||'Terjadi kesalahan JavaScript.')+'</p><button class="btn teal-btn" onclick="location.reload()">Muat Ulang</button></section>'}});window.addEventListener('unhandledrejection',function(event){console.error(event.reason);const target=document.getElementById('content');if(target&&event.reason){target.innerHTML='<section class="panel"><h1>Terjadi kesalahan</h1><p>'+String(event.reason.message||event.reason)+'</p><button class="btn teal-btn" onclick="location.reload()">Muat Ulang</button></section>'}});</script><script src="js/common.js"></script><script src="js/app.js"></script>
</body></html>
